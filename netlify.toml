[build]
  publish = "dist"
  command = "npm run build"

# www redirect
[[redirects]]
  from    = "https://arihantanchal.in/*"
  to      = "https://www.arihantanchal.in/:splat"
  status  = 301
  force   = true

# Google Search Console verification file — serve as-is, never rewrite
[[redirects]]
  from  = "/google28a5fa94b18bdf18.html"
  to    = "/google28a5fa94b18bdf18.html"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache hashed JS/CSS assets forever (Vite adds content hash to filename)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — never cache (always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images — cache 30 days
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
